<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="How an expense logged offline reaches the database exactly once">
  <rect width="1000" height="360" fill="#0b0e13"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="40" y="46" fill="#e8ecf2" font-size="24" font-weight="700">Logged on the bus, with no signal</text>

    <defs>
      <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
      </marker>
    </defs>

    <!-- 1. phone offline -->
    <g>
      <rect x="40" y="96" width="250" height="180" rx="14" fill="#141922" stroke="#262e3b"/>
      <circle cx="70" cy="128" r="7" fill="#fbbf24"/>
      <text x="88" y="133" fill="#fbbf24" font-size="14" font-weight="600">Offline</text>
      <text x="64" y="176" fill="#e8ecf2" font-size="17" font-weight="600">You log Rs 80</text>
      <text x="64" y="202" fill="#8d97a6" font-size="14">transport &#183; &#8220;bus home&#8221;</text>
      <rect x="64" y="222" width="150" height="26" rx="8" fill="#1b212c" stroke="#262e3b"/>
      <text x="76" y="240" fill="#8d97a6" font-size="12">waiting to sync</text>
    </g>

    <path d="M300 186 L360 186" stroke="#6366f1" stroke-width="2" marker-end="url(#a2)"/>

    <!-- 2. outbox -->
    <g>
      <rect x="372" y="96" width="256" height="180" rx="14" fill="#141922" stroke="#262e3b"/>
      <text x="396" y="128" fill="#e8ecf2" font-size="17" font-weight="600">Outbox</text>
      <text x="396" y="150" fill="#8d97a6" font-size="13">localStorage on your phone</text>
      <rect x="396" y="166" width="208" height="60" rx="8" fill="#1b212c" stroke="#262e3b"/>
      <text x="410" y="188" fill="#8d97a6" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">id: 9f3a1c&#8230; (uuid)</text>
      <text x="410" y="210" fill="#8d97a6" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">amount: 8000 paisa</text>
      <text x="396" y="252" fill="#646d7a" font-size="12">survives a closed tab or a dead battery</text>
    </g>

    <path d="M638 186 L698 186" stroke="#6366f1" stroke-width="2" marker-end="url(#a2)"/>
    <text x="668" y="172" fill="#8d97a6" font-size="12" text-anchor="middle">online</text>

    <!-- 3. database -->
    <g>
      <rect x="710" y="96" width="250" height="180" rx="14" fill="#141922" stroke="#262e3b"/>
      <ellipse cx="760" cy="132" rx="26" ry="9" fill="none" stroke="#34d399" stroke-width="2"/>
      <path d="M734 132 v22 a26 9 0 0 0 52 0 v-22" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="800" y="142" fill="#e8ecf2" font-size="17" font-weight="600">Postgres</text>
      <rect x="734" y="184" width="204" height="30" rx="8" fill="#1b212c" stroke="#262e3b"/>
      <text x="746" y="204" fill="#34d399" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">on conflict (id) do nothing</text>
      <text x="734" y="240" fill="#8d97a6" font-size="13">inserted once, however many</text>
      <text x="734" y="258" fill="#8d97a6" font-size="13">times the sync retries</text>
    </g>

    <text x="40" y="322" fill="#646d7a" font-size="14">The entry counts in today&#8217;s total the moment you type it &#8212; the sync is just bookkeeping that happens later.</text>
  </g>
</svg>
