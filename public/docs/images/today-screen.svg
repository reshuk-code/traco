<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img" aria-label="The traco Today screen: budget meter, log form, and today's entries">
  <rect width="880" height="600" fill="#0b0e13"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- phone -->
    <rect x="60" y="40" width="320" height="520" rx="30" fill="#141922" stroke="#262e3b"/>
    <text x="78" y="82" fill="#e8ecf2" font-size="16" font-weight="700">traco</text>
    <text x="362" y="82" fill="#646d7a" font-size="12" text-anchor="end">Wed 28 Aug</text>

    <!-- goal meter card -->
    <rect x="76" y="96" width="288" height="140" rx="14" fill="#1b212c" stroke="#262e3b"/>
    <text x="92" y="120" fill="#8d97a6" font-size="11">Spent today</text>
    <text x="92" y="152" fill="#e8ecf2" font-size="28" font-weight="700">Rs 320</text>
    <text x="348" y="120" fill="#8d97a6" font-size="11" text-anchor="end">Available</text>
    <text x="348" y="146" fill="#e8ecf2" font-size="15" font-weight="700" text-anchor="end">Rs 500</text>
    <rect x="92" y="166" width="256" height="8" rx="4" fill="#232b38"/>
    <rect x="92" y="166" width="164" height="8" rx="4" fill="#34d399"/>
    <text x="92" y="192" fill="#34d399" font-size="12" font-weight="600">Within budget</text>
    <text x="348" y="192" fill="#8d97a6" font-size="12" text-anchor="end">Rs 180 left</text>
    <rect x="92" y="202" width="256" height="26" rx="8" fill="#141922"/>
    <text x="102" y="219" fill="#8d97a6" font-size="11">Saved up so far</text>
    <text x="338" y="219" fill="#34d399" font-size="12" font-weight="600" text-anchor="end">Rs 300</text>

    <!-- log form card -->
    <rect x="76" y="248" width="288" height="104" rx="14" fill="#1b212c" stroke="#262e3b"/>
    <text x="92" y="270" fill="#e8ecf2" font-size="12" font-weight="700">Log an expense</text>
    <rect x="92" y="280" width="130" height="28" rx="8" fill="#141922" stroke="#262e3b"/>
    <text x="104" y="299" fill="#8d97a6" font-size="12">Rs 80</text>
    <rect x="292" y="280" width="56" height="28" rx="8" fill="#6366f1"/>
    <text x="320" y="299" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Add</text>
    <rect x="92" y="316" width="44" height="24" rx="8" fill="#141922" stroke="#262e3b"/>
    <text x="114" y="332" fill="#8d97a6" font-size="11" text-anchor="middle">food</text>
    <rect x="142" y="316" width="72" height="24" rx="8" fill="#6366f1"/>
    <text x="178" y="332" fill="#ffffff" font-size="11" text-anchor="middle">transport</text>
    <rect x="220" y="316" width="40" height="24" rx="8" fill="#141922" stroke="#262e3b"/>
    <text x="240" y="332" fill="#8d97a6" font-size="11" text-anchor="middle">fun</text>
    <rect x="266" y="316" width="40" height="24" rx="8" fill="#141922" stroke="#262e3b"/>
    <text x="286" y="332" fill="#8d97a6" font-size="11" text-anchor="middle">bills</text>

    <!-- entries card -->
    <rect x="76" y="364" width="288" height="132" rx="14" fill="#1b212c" stroke="#262e3b"/>
    <text x="92" y="386" fill="#e8ecf2" font-size="12" font-weight="700">Today&#8217;s entries</text>
    <text x="348" y="386" fill="#646d7a" font-size="11" text-anchor="end">3</text>
    <line x1="92" y1="396" x2="348" y2="396" stroke="#262e3b"/>
    <text x="92" y="416" fill="#e8ecf2" font-size="12">food &#183; <tspan fill="#8d97a6">tea + samosa</tspan></text>
    <text x="348" y="416" fill="#e8ecf2" font-size="12" text-anchor="end">Rs 120</text>
    <line x1="92" y1="428" x2="348" y2="428" stroke="#262e3b"/>
    <text x="92" y="448" fill="#e8ecf2" font-size="12">transport &#183; <tspan fill="#8d97a6">bus home</tspan></text>
    <text x="348" y="448" fill="#e8ecf2" font-size="12" text-anchor="end">Rs 60</text>
    <line x1="92" y1="460" x2="348" y2="460" stroke="#262e3b"/>
    <text x="92" y="480" fill="#e8ecf2" font-size="12">fun &#183; <tspan fill="#fbbf24">waiting to sync</tspan></text>
    <text x="348" y="480" fill="#e8ecf2" font-size="12" text-anchor="end">Rs 140</text>

    <!-- bottom nav -->
    <rect x="76" y="508" width="288" height="34" rx="12" fill="#1b212c" stroke="#262e3b"/>
    <text x="124" y="530" fill="#6366f1" font-size="12" font-weight="600" text-anchor="middle">Today</text>
    <text x="220" y="530" fill="#8d97a6" font-size="12" text-anchor="middle">History</text>
    <text x="316" y="530" fill="#8d97a6" font-size="12" text-anchor="middle">Settings</text>

    <!-- callouts -->
    <g stroke="#262e3b" stroke-width="1.5">
      <path d="M366 166 L424 166" fill="none"/>
      <path d="M366 300 L424 300" fill="none"/>
      <path d="M366 440 L424 440" fill="none"/>
    </g>
    <g>
      <text x="440" y="158" fill="#e8ecf2" font-size="17" font-weight="600">One number, one question</text>
      <text x="440" y="184" fill="#8d97a6" font-size="14">&#8220;Can I afford this right now?&#8221; &#8212; answered before</text>
      <text x="440" y="204" fill="#8d97a6" font-size="14">you reach the counter, not at the end of the month.</text>

      <text x="440" y="292" fill="#e8ecf2" font-size="17" font-weight="600">Five seconds to log</text>
      <text x="440" y="318" fill="#8d97a6" font-size="14">Amount, category, done. A tracker you have to</text>
      <text x="440" y="338" fill="#8d97a6" font-size="14">sit down for is a tracker you stop opening.</text>

      <text x="440" y="432" fill="#e8ecf2" font-size="17" font-weight="600">Counted even when unsynced</text>
      <text x="440" y="458" fill="#8d97a6" font-size="14">Entries logged with no signal are marked pending</text>
      <text x="440" y="478" fill="#8d97a6" font-size="14">and still added to today&#8217;s total.</text>
    </g>
  </g>
</svg>
