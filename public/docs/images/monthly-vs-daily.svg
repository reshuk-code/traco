    <rect x="624" y="152" width="9" height="12" rx="3" fill="#34d399"/>
    <rect x="638" y="130" width="9" height="34" rx="3" fill="#34d399"/>
    <rect x="652" y="144" width="9" height="20" rx="3" fill="#34d399"/>
    <rect x="666" y="112" width="9" height="52" rx="3" fill="#f87171"/>
    <rect x="680" y="148" width="9" height="16" rx="3" fill="#34d399"/>
    <rect x="694" y="136" width="9" height="28" rx="3" fill="#34d399"/>
    <rect x="708" y="126" width="9" height="38" rx="3" fill="#34d399"/>
    <rect x="722" y="140" width="9" height="24" rx="3" fill="#34d399"/>
    <rect x="736" y="118" width="9" height="46" rx="3" fill="#f87171"/>
    <rect x="750" y="150" width="9" height="14" rx="3" fill="#34d399"/>
    <rect x="764" y="132" width="9" height="32" rx="3" fill="#34d399"/>
    <rect x="778" y="142" width="9" height="22" rx="3" fill="#34d399"/>
    <rect x="792" y="122" width="9" height="42" rx="3" fill="#34d399"/>
    <rect x="806" y="146" width="9" height="18" rx="3" fill="#34d399"/>
