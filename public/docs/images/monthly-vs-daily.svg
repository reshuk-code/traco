    <rect x="918" y="140" width="9" height="24" rx="3" fill="#34d399"/>
    <rect x="932" y="130" width="9" height="34" rx="3" fill="#34d399"/>
    <rect x="946" y="144" width="9" height="20" rx="3" fill="#34d399"/>
    <line x1="540" y1="168" x2="946" y2="168" stroke="#262e3b" stroke-width="2"/>
    <text x="540" y="190" fill="#646d7a" font-size="13">day 1</text>
    <text x="946" y="190" fill="#646d7a" font-size="13" text-anchor="end">day 30</text>
    <text x="540" y="222" fill="#34d399" font-size="15" font-weight="600">You know by 8pm, every day.</text>
    <text x="540" y="256" fill="#8d97a6" font-size="15">A day is short enough to picture and short</text>
    <text x="540" y="278" fill="#8d97a6" font-size="15">enough to fix. Tomorrow is always a new</text>
    <text x="540" y="300" fill="#8d97a6" font-size="15">chance to get it right.</text>
  </g>
