<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" role="img" aria-label="A monthly budget versus a daily budget">
  <rect width="980" height="380" fill="#0b0e13"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="40" y="46" fill="#8d97a6" font-size="15" letter-spacing="2">ONE MONTHLY NUMBER</text>
    <text x="40" y="96" fill="#e8ecf2" font-size="20" font-weight="600">Rs 6,000 for the month</text>
    <rect x="40" y="120" width="400" height="44" rx="10" fill="#232b38"/>
    <rect x="40" y="120" width="268" height="44" rx="10" fill="#f87171"/>
    <path d="M308 168 L308 196" stroke="#f87171" stroke-width="2"/>
    <text x="40" y="222" fill="#f87171" font-size="15" font-weight="600">Day 19: it&#8217;s gone. Eleven days to go.</text>
    <text x="40" y="256" fill="#8d97a6" font-size="15">A month is too long to feel. You find out you</text>
    <text x="40" y="278" fill="#8d97a6" font-size="15">overspent long after you could have done</text>
    <text x="40" y="300" fill="#8d97a6" font-size="15">anything about it.</text>

    <line x1="490" y1="40" x2="490" y2="340" stroke="#262e3b"/>

    <text x="540" y="46" fill="#8d97a6" font-size="15" letter-spacing="2">THIRTY SMALL ONES</text>
    <text x="540" y="96" fill="#e8ecf2" font-size="20" font-weight="600">Rs 200 today</text>
    <rect x="540" y="142" width="9" height="22" rx="3" fill="#34d399"/>
