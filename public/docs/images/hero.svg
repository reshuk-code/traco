<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="traco — why a daily budget works for students">
  <rect width="1200" height="420" fill="#0b0e13"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="64" y="60" width="20" height="20" rx="6" fill="#6366f1"/>
    <text x="98" y="77" fill="#8d97a6" font-size="22" letter-spacing="5">TRACO</text>
    <text x="64" y="176" fill="#e8ecf2" font-size="62" font-weight="700" letter-spacing="-2">Spend less today,</text>
    <text x="64" y="246" fill="#e8ecf2" font-size="62" font-weight="700" letter-spacing="-2">have more tomorrow.</text>
    <text x="64" y="306" fill="#8d97a6" font-size="26">A daily budget that grows every time you come in under it —</text>
    <text x="64" y="342" fill="#8d97a6" font-size="26">built for the way student money actually moves.</text>

    <g>
      <rect x="806" y="316" width="34" height="64"  rx="8" fill="#6366f1"/>
      <rect x="854" y="280" width="34" height="100" rx="8" fill="#6366f1"/>
      <rect x="902" y="230" width="34" height="150" rx="8" fill="#f87171"/>
      <rect x="950" y="294" width="34" height="86"  rx="8" fill="#6366f1"/>
      <rect x="998" y="262" width="34" height="118" rx="8" fill="#6366f1"/>
      <rect x="1046" y="326" width="34" height="54" rx="8" fill="#6366f1"/>
      <rect x="1094" y="240" width="34" height="140" rx="8" fill="#6366f1"/>
      <text x="806" y="400" fill="#646d7a" font-size="15">mon</text>
      <text x="1094" y="400" fill="#646d7a" font-size="15">sun</text>
    </g>
  </g>
</svg>
